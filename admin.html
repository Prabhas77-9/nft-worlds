<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>

<style>

body{
background:#0d1117;
color:white;
font-family:Arial;
text-align:center;
}

input,button{
padding:10px;
margin:5px;
}

.card{
background:#161b22;
padding:20px;
border-radius:10px;
margin:20px;
}

</style>

</head>

<body>

<h1>ADMIN NFT CONTROL</h1>

<div class="card">

<input type="text" id="img" placeholder="NFT Image URL">

<input type="number" id="price" placeholder="Price">

<input type="number" id="limit" placeholder="Entry Limit">

<br>

<button onclick="addNFT()">UPLOAD NFT</button>

</div>

<script>

function addNFT(){

let img=document.getElementById("img").value
let price=document.getElementById("price").value
let limit=document.getElementById("limit").value

let nfts=JSON.parse(localStorage.getItem("nfts"))||[]

nfts.push({
image:img,
price:price,
limit:limit
})

localStorage.setItem("nfts",JSON.stringify(nfts))

alert("NFT Uploaded")

}

</script>

</body>
</html>
